<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat output</title>
  <style>
    :root {
      --chat-background: #1e1e1e;
      --chat-foreground: #d4d4d4;
      --chat-font-family: "Cascadia Code", Consolas, "Courier New", monospace;
      --chat-font-size: 13px;
      --chat-role: #9cdcfe;
      --chat-user: #4ec9b0;
      --chat-reasoning: #808080;
      --chat-meta: #808080;
      --chat-error: #f48771;
      --chat-uri: #569cd6;
      --chat-tool-summary: #c586c0;
      --chat-tool-body-background: #252526;
      --copy-btn-color: #808080;
      --copy-btn-hover-color: #d4d4d4;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--chat-background);
      color: var(--chat-foreground);
      font-family: var(--chat-font-family);
      font-size: var(--chat-font-size);
    }

    body {
      padding: 8px 8px 8px 2.5em;
      box-sizing: border-box;
      overflow-y: auto;
      white-space: normal;
    }

    .chat-message {
      margin-bottom: 10px;
    }

    .chat-header {
      color: var(--chat-role);
      font-weight: bold;
      margin-bottom: 2px;
    }

    .chat-user-message .chat-header {
      color: var(--chat-user);
    }

    .chat-content {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 1px 0;
    }

    .chat-reasoning {
      color: var(--chat-reasoning);
      font-style: italic;
    }

    .chat-text {
      white-space: normal;
    }

    .chat-text > :first-child {
      margin-top: 0;
    }

    .chat-text > :last-child {
      margin-bottom: 0;
    }

    .chat-text p {
      margin: 0.4em 0;
      white-space: pre-wrap;
    }

    .chat-text h1,
    .chat-text h2,
    .chat-text h3,
    .chat-text h4,
    .chat-text h5,
    .chat-text h6 {
      margin: 0.5em 0 0.3em;
    }

    .chat-text ul,
    .chat-text ol {
      margin: 0.4em 0;
      padding-left: 1.5em;
    }

    .chat-text blockquote {
      margin: 0.4em 0;
      padding-left: 10px;
      border-left: 3px solid var(--chat-meta);
    }

    .chat-text code {
      font-family: var(--chat-font-family);
    }

    .chat-text pre {
      margin: 0.4em 0;
      padding: 6px 8px;
      background: var(--chat-tool-body-background);
      white-space: pre;
      overflow-x: auto;
    }

    .chat-text pre code {
      white-space: inherit;
    }

    .chat-text table {
      border-collapse: collapse;
      margin: 0.4em 0;
    }

    .chat-text th,
    .chat-text td {
      border: 1px solid var(--chat-meta);
      padding: 4px 8px;
    }

    .chat-text thead tr {
      background: var(--chat-tool-body-background);
    }

    .chat-meta,
    .chat-monospace {
      color: var(--chat-meta);
    }

    .chat-error {
      color: var(--chat-error);
    }

    .chat-uri {
      color: var(--chat-uri);
    }

    details.chat-content > summary {
      cursor: pointer;
      color: var(--chat-tool-summary);
      white-space: pre-wrap;
    }

    details.chat-content > .chat-collapsible-body {
      margin: 4px 0 4px 12px;
      padding: 6px 8px;
      background: var(--chat-tool-body-background);
      white-space: pre-wrap;
      word-break: break-word;
      overflow-x: auto;
    }

    .chat-tool-group > summary {
      cursor: pointer;
      user-select: none;
      color: var(--chat-tool-summary);
    }

    .tool-count-badge {
      font-size: 0.75em;
      opacity: 0.6;
      margin-left: 0.5em;
    }

    .chat-tool-group[open] .tool-count-badge {
      display: none;
    }

    .chat-tool-group-body {
      padding-left: 1em;
      border-left: 2px solid var(--chat-tool-summary);
    }

    /* copy-gutter component ------------------------------------------------- */

    .copy-gutter-host {
      position: relative;
    }

    .copy-gutter-btn {
      position: absolute;
      left: -2.2em;
      top: 0.1em;
      width: 1.6em;
      height: 1.6em;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      opacity: 0;
      transition: opacity 120ms ease;
      font-size: inherit;
      color: var(--copy-btn-color);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
    }

    .copy-gutter-host:hover .copy-gutter-btn,
    .copy-gutter-btn:focus-visible {
      opacity: 1;
    }

    .copy-gutter-btn:hover {
      color: var(--copy-btn-hover-color);
    }

    .copy-gutter-btn.confirmed {
      color: #4ec9b0;
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="chat-history"></div>
  <div id="chat-running"></div>
  <script>
    /* copy-gutter.js — reusable copy-to-clipboard component.
     * Call CopyGutter.init(root) to wire up all [data-copy-target] elements inside root.
     * A MutationObserver keeps watching for elements added later (streaming / incremental updates).
     */
    var CopyGutter = (function () {
      "use strict";

      var CONFIRMATION_MS = 1200;

      function init(root) {
        root.querySelectorAll("[data-copy-target]").forEach(attach);
        var observer = new MutationObserver(function (mutations) {
          mutations.forEach(function (mutation) {
            mutation.addedNodes.forEach(function (node) {
              if (node.nodeType !== 1) { return; }
              if (node.hasAttribute("data-copy-target")) { attach(node); }
              node.querySelectorAll("[data-copy-target]").forEach(attach);
            });
          });
        });
        observer.observe(root, { childList: true, subtree: true });
      }

      function attach(el) {
        if (el._copyGutterAttached) { return; }
        el._copyGutterAttached = true;
        el.classList.add("copy-gutter-host");

        var btn = document.createElement("button");
        btn.className = "copy-gutter-btn";
        btn.setAttribute("aria-label", "Copy to clipboard");
        btn.setAttribute("aria-hidden", "true");
        btn.textContent = "\u2398"; /* ⎘ copy symbol */

        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          var text = extractText(el);
          navigator.clipboard.writeText(text).then(function () {
            btn.textContent = "\u2713"; /* ✓ */
            btn.classList.add("confirmed");
            setTimeout(function () {
              btn.textContent = "\u2398";
              btn.classList.remove("confirmed");
            }, CONFIRMATION_MS);
          });
        });

        el.insertBefore(btn, el.firstChild);
      }

      function extractText(el) {
        var selector = el.getAttribute("data-copy-target");
        if (selector) {
          var target = el.querySelector(selector);
          if (target) { return target.innerText; }
        }
        /* Clone and strip copy buttons so their symbol text is excluded. */
        var clone = el.cloneNode(true);
        clone.querySelectorAll(".copy-gutter-btn").forEach(function (b) { b.remove(); });
        return clone.innerText;
      }

      return { init: init };
    })();
  </script>
  <script>
    (function () {
      "use strict";

      function postToHost(message) {
        if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
          window.chrome.webview.postMessage(JSON.stringify(message));
        }
      }

      function isNearBottom() {
        var slack = 24;
        return (window.innerHeight + window.scrollY) >= (document.body.scrollHeight - slack);
      }

      function scrollToBottom() {
        window.scrollTo(0, document.body.scrollHeight);
      }

      function applyCommand(command) {
        switch (command.type) {
          case "update": {
            var target = document.getElementById(command.path);
            if (!target) {
              return;
            }
            switch (command.location) {
              case "replace":
                target.outerHTML = command.content;
                break;
              case "before":
                target.insertAdjacentHTML("beforebegin", command.content);
                break;
              case "after":
                target.insertAdjacentHTML("afterend", command.content);
                break;
              case "append":
                target.insertAdjacentHTML("beforeend", command.content);
                break;
            }
            break;
          }
          case "remove": {
            var element = document.getElementById(command.path);
            if (element) {
              element.remove();
            }
            break;
          }
          case "scroll":
            scrollToBottom();
            break;
          case "theme": {
            if (command.variables) {
              var root = document.documentElement;
              Object.keys(command.variables).forEach(function (key) {
                root.style.setProperty(key, command.variables[key]);
              });
            }
            break;
          }
        }
      }

      window.hostBridge = {
        receiveMessage: function (payload) {
          try {
            applyCommand(JSON.parse(payload));
          } catch (error) {
            postToHost({ type: "error", message: String(error) });
          }
        }
      };

      window.addEventListener("scroll", function () {
        postToHost({ type: "scrollState", atBottom: isNearBottom() });
      }, { passive: true });

      // Intercept all anchor clicks and post to host instead of navigating the WebView.
      document.addEventListener("click", function (e) {
        var anchor = e.target.closest("a[href]");
        if (!anchor) { return; }
        var href = anchor.getAttribute("href");
        if (!href || href.startsWith("#")) { return; }
        e.preventDefault();
        postToHost({ type: "openUrl", url: anchor.href });
      }, true);

      postToHost({ type: "ready" });

      // Initialise the copy-gutter component once the host bridge is wired up.
      CopyGutter.init(document);
    })();
  </script>
</body>
</html>
