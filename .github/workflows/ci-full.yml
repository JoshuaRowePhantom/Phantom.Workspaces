name: CI (full)

# Runs the full suite that the fast PR gate skips: the Windows-only integration
# tests on windows-latest and the cross-platform Docker/data-layer tests on
# ubuntu-latest (MongoDB Atlas Local is a Linux container that cannot run on
# hosted windows-latest). Run on demand and gated before release; the nightly
# schedule was removed so runs only happen intentionally (e.g. before a tag).

on:
  workflow_dispatch:

concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-full:
    name: Windows build + integration tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      AVALONIA_UI_LICENSE_KEY: ${{ secrets.AVALONIA_UI_LICENSE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up build
        uses: ./.github/actions/setup-build

      - name: Build (Release)
        shell: pwsh
        run: dotnet build Phantom.Workspaces.slnx -c Release --no-restore

      # The SDK-staged copilot.exe is a server-only runtime (it rejects --version).
      # BYOK tests need the full standalone CLI, pinned to the SDK's CLI version.
      - name: Install Copilot CLI for BYOK tests
        shell: pwsh
        run: |
          $version = '1.0.83' # GitHub.Copilot.SDK 1.0.13's CopilotCliVersion
          $expectedSha256 = '0e07221a275fdf7e61619c53566e3a421fd646d74d8e9ca491dbbff221f22945'
          $directory = Join-Path $PWD '.ci-tools\copilot'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $archive = Join-Path $directory 'copilot.zip'
          Invoke-WebRequest "https://github.com/github/copilot-cli/releases/download/v$version/copilot-win32-x64.zip" -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expectedSha256) {
            throw "Copilot CLI archive hash mismatch"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $cli = Join-Path $directory 'copilot.exe'
          if (-not (Test-Path -LiteralPath $cli -PathType Leaf)) {
            throw "Standalone Copilot CLI not found: $cli"
          }
          & $cli --version
          if ($LASTEXITCODE -ne 0) {
            throw "Standalone Copilot CLI failed its version check (exit $LASTEXITCODE)"
          }
          "COPILOT_CLI_PATH=$cli" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # windows-latest cannot start the Linux MongoDB container, so exclude the
      # SlowDocker tests here; they run in the ubuntu-latest job below. Also exclude
      # RequiresLocalConsole: the hosted windows-latest ConPTY renders no cmd.exe/pwsh
      # output bytes even though input and process exit work, so tests that assert on
      # captured shell output cannot pass on the hosted runner. They still run under
      # local -Mode full and local stability. Tracked by #1283.
      - name: Run Windows suite (excluding SlowDocker and RequiresLocalConsole)
        shell: pwsh
        run: |
          dotnet test Phantom.Workspaces.slnx --no-restore --nologo -v minimal `
            -maxcpucount:1 `
            --filter "Category!=SlowDocker & Category!=RequiresLocalConsole"

      - name: Upload Windows test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-full-windows-logs
          path: scripts/test-results.log
          if-no-files-found: ignore

  linux-data-layer:
    name: Linux Docker/data-layer tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AVALONIA_UI_LICENSE_KEY: ${{ secrets.AVALONIA_UI_LICENSE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up build
        uses: ./.github/actions/setup-build

      # Pull before the test host starts: Atlas Local's cold image download can exceed the
      # test harness's per-test inactivity watchdog on a fresh hosted runner.
      - name: Pull MongoDB Atlas Local image
        run: docker pull mongodb/mongodb-atlas-local:latest

      # The image runs as a non-root user. New bind directories created by .NET under
      # the runner's default TMPDIR are owned by the runner and are not writable by MongoDB.
      # Default ACLs also cover the unique directories created by the replica-set tests.
      - name: Prepare writable MongoDB test mounts
        shell: bash
        run: |
          if ! command -v setfacl >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y acl
          fi
          mongo_uid=$(docker run --rm --entrypoint id mongodb/mongodb-atlas-local:latest -u)
          directory="$GITHUB_WORKSPACE/.ci-tools/mongodb-tmp"
          mkdir -p "$directory"
          setfacl -m "u:$mongo_uid:rwx,d:u:$mongo_uid:rwx" "$directory"
          echo "TMPDIR=$directory" >> "$GITHUB_ENV"

      # Only the platform-agnostic data-layer Docker/Git integration tests run on
      # Linux; the Windows-only GUI/scheduled-task/junction tests run above.
      - name: Run Docker + Git integration tests
        shell: pwsh
        run: .\scripts\run-tests.ps1 -Mode full -TestNames Phantom.Workspaces.Data.MongoDB.Tests -PerTestHangTimeout 10m

      - name: Diagnose MongoDB container on failure
        if: failure()
        run: |
          docker ps -a --filter name=pw-mongodb-test
          docker inspect pw-mongodb-test --format '{{json .State}}' || true
          docker logs --tail 150 pw-mongodb-test 2>&1 || true
          free -h

      - name: Upload Linux test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-full-linux-logs
          path: scripts/test-results.log
          if-no-files-found: ignore
