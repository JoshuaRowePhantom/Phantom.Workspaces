name: Publish validation

# Runs a full dotnet publish for win-x64 and packages the portable zip
# without releasing, to catch packaging regressions between releases. Scheduled
# weekly and on demand.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-smoke:
    name: Publish + package smoke test (windows-latest)
    runs-on: windows-latest
    env:
      AVALONIA_UI_LICENSE_KEY: ${{ secrets.AVALONIA_UI_LICENSE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up build
        uses: ./.github/actions/setup-build

      - name: Assert Copilot SDK version pin
        shell: pwsh
        run: .\packaging\validate\Assert-CopilotSdkVersion.ps1

      - name: Publish and package win-x64
        shell: pwsh
        run: |
          $version = "0.0.0-validation"
          $output = Join-Path $env:RUNNER_TEMP 'validation-assets'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          foreach ($rid in @('win-x64')) {
            $publishDir = Join-Path $env:RUNNER_TEMP "publish/$rid"
            dotnet publish Phantom.Workspaces/Phantom.Workspaces.csproj `
              -c Release -r $rid -p:Version=$version -o $publishDir
            if ($LASTEXITCODE -ne 0) { throw "publish failed for $rid" }
            # Issue #1376: assert the bundled Copilot runtime + CLI license ship in the payload.
            # Run the startup smoke only for the host RID (win-x64 on the x64 runner).
            $skipSmoke = $rid -ne 'win-x64'
            .\packaging\validate\Assert-CopilotRuntimePayload.ps1 `
              -PayloadDirectory $publishDir -RuntimeIdentifier $rid -SkipStartupSmoke:$skipSmoke
            .\packaging\validate\Assert-MxcRuntimePayload.ps1 `
              -PayloadDirectory $publishDir -RuntimeIdentifier $rid
            .\packaging\zip\New-ReleaseZip.ps1 `
              -PublishDirectory $publishDir -Version $version `
              -RuntimeIdentifier $rid -OutputDirectory $output
            $zipPath = Join-Path $output "Phantom.Workspaces-$version-$rid.zip"
            .\packaging\validate\Assert-MxcRuntimeZip.ps1 `
              -ZipPath $zipPath -RuntimeIdentifier $rid
          }

      - name: Upload validation assets
        uses: actions/upload-artifact@v7
        with:
          name: publish-validation-assets
          path: ${{ runner.temp }}/validation-assets
          if-no-files-found: error
