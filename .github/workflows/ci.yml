name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and fast tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      AVALONIA_UI_LICENSE_KEY: ${{ secrets.AVALONIA_UI_LICENSE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up build
        uses: ./.github/actions/setup-build

      - name: Build (Release)
        shell: pwsh
        run: dotnet build Phantom.Workspaces.slnx -c Release --no-restore

      - name: Run fast test suite
        shell: pwsh
        run: |
          Write-Host 'Fast filter: Category!=SlowDocker & Category!=SlowGit & Category!=Integration & Category!=WebView & Category!=SlowLayout'
          .\scripts\run-tests.ps1 -Mode fast

      - name: Upload test results log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-log
          path: scripts/test-results.log
          if-no-files-found: warn
